# One service: Express API + in-process job worker + built React app.
# The worker and the web server share the SQLite DB and output files on the disk,
# and a Render disk attaches to exactly one service, so they cannot be split.
services:
  - type: web
    name: executive-presentations
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: 0.5c-512mb # cheapest plan with a disk; move to 1c-2g if LibreOffice rendering runs out of memory
    region: oregon
    healthCheckPath: /
    autoDeployTrigger: commit
    disk:
      name: app-data
      mountPath: /var/data # matches DATA_DIR: app.db, uploads/, jobs/
      sizeGB: 5
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false # prompted for in the dashboard; never committed
      - key: DAILY_JOB_LIMIT
        value: "50"
